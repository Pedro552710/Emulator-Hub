name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Python 3.12 einrichten
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Abhängigkeiten installieren
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Abhängigkeiten konnten nicht installiert werden.' }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Abhängigkeiten sind nicht konsistent.' }
      - name: Dateien vor Veröffentlichung prüfen
        run: |
          & .\.venv\Scripts\python.exe tools\audit_publication.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Die Prüfung der Repository-Dateien ist fehlgeschlagen.' }
      - name: Offline-Tests ausführen
        run: |
          & .\.venv\Scripts\python.exe -m unittest discover -s tests -t . -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests fehlgeschlagen.' }
      - name: Programmstart prüfen
        run: |
          & .\.venv\Scripts\python.exe main.py --smoke-test --check-integrations --data-dir test-artifacts\ci-start --screenshot test-artifacts\ci-start.png
          if ($LASTEXITCODE -ne 0) { throw 'Programmstart fehlgeschlagen.' }
